<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidxeno - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        background: "#09090b",
                        surface: "#18181b",
                        primary: { 500: "#8b5cf6" },
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-background text-zinc-100 min-h-screen font-sans selection:bg-primary-500/30">
    
    <nav class="border-b border-zinc-800 bg-surface/50 backdrop-blur-xl sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <i data-lucide="shield-check" class="w-6 h-6 text-primary-500"></i>
                <span class="text-xl font-bold tracking-tight">Vidxeno <span class="text-zinc-500 font-normal">Admin</span></span>
            </div>
            <a href="/" class="text-sm font-medium text-zinc-400 hover:text-white transition-colors flex items-center gap-2">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to App
            </a>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-6 py-12">
        <div class="mb-10">
            <h1 class="text-3xl font-bold mb-2">Overview</h1>
            <p class="text-zinc-400">Real-time statistics for video downloads.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-12" id="stats-grid">
            <!-- Loading placeholders -->
            <div class="bg-surface border border-zinc-800 rounded-xl p-6 animate-pulse h-32"></div>
        </div>
    </main>

    <script>
        lucide.createIcons();
        function formatBytes(bytes) {
            if (!+bytes) return "0 Bytes";
            const k = 1024;
            const sizes = ["Bytes", "KB", "MB", "GB", "TB"];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return `${parseFloat((bytes / Math.pow(k, i)).toFixed(2))} ${sizes[i]}`;
        }
        async function fetchStats() {
            try {
                const response = await fetch("/api/stats");
                if (!response.ok) throw new Error("Failed to load");
                const data = await response.json();
                
                const grid = document.getElementById("stats-grid");
                grid.innerHTML = `
                    <div class="bg-surface border border-zinc-800 rounded-xl p-6 flex flex-col justify-center">
                        <div class="flex items-center gap-3 mb-2 text-zinc-400">
                            <i data-lucide="download" class="w-5 h-5 text-emerald-500"></i>
                            <span class="text-sm font-medium uppercase tracking-wider">Total Downloads</span>
                        </div>
                        <p class="text-4xl font-bold text-white">${data.total_downloads.toLocaleString()}</p>
                    </div>

                    <div class="bg-surface border border-zinc-800 rounded-xl p-6 flex flex-col justify-center">
                        <div class="flex items-center gap-3 mb-2 text-zinc-400">
                            <i data-lucide="hard-drive" class="w-5 h-5 text-blue-500"></i>
                            <span class="text-sm font-medium uppercase tracking-wider">Bandwidth Used</span>
                        </div>
                        <p class="text-4xl font-bold text-white">${formatBytes(data.total_bytes)}</p>
                    </div>

                    <div class="bg-surface border border-zinc-800 rounded-xl p-6 flex flex-col justify-center">
                        <div class="flex items-center gap-3 mb-2 text-zinc-400">
                            <i data-lucide="file-video" class="w-5 h-5 text-primary-500"></i>
                            <span class="text-sm font-medium uppercase tracking-wider">MP4 / MP3</span>
                        </div>
                        <div class="flex items-baseline gap-2">
                            <p class="text-4xl font-bold text-white">${data.mp4_downloads}</p>
                            <span class="text-zinc-500 font-medium">/</span>
                            <p class="text-2xl font-semibold text-zinc-400">${data.mp3_downloads}</p>
                        </div>
                    </div>
                `;
                lucide.createIcons();
            } catch (err) {
                document.getElementById("stats-grid").innerHTML = `<div class="col-span-full text-red-500">Error loading stats.</div>`;
            }
        }
        fetchStats();
        setInterval(fetchStats, 5000);
    </script>
</body>
</html>
